appId: com.soostori.pos
productName: Soostori POS
copyright: Copyright © 2025 Soostori

# Disable asar — symlinks in pnpm workspace point outside the project root,
# causing electron-builder to fail with "must be under" errors.
# Native modules are handled via asarUnpack instead.
asar: false

asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/@serialport/**"
  - "**/node_modules/serialport/**"

extraMetadata:
  main: dist-electron/main.js

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!**/node_modules/@soostori/**"
  - "!**/node_modules/.pnpm/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Soostori POS
  artifactName: ${productName}-Setup-${version}.${ext}

# Publish is handled in the release workflow via softprops/action-gh-release.
# Keeping publishing disabled here prevents electron-builder from trying to
# create a GitHub release during the packaging phase and failing with 403s.
