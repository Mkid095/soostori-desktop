name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Write Verdaccio .npmrc
        run: |
          # Auth token is stored as a GitHub secret
          # Full .npmrc content: registry URL + auth token
          echo "@soostori:registry=https://registry.nextmavens.com/" > .npmrc
          echo "//registry.nextmavens.com/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc
          cat .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Checkout soostori-sdk (for tsconfig paths)
        uses: actions/checkout@v4
        with:
          repository: Mkid095/soostori-sdk
          ref: main
          path: soostori-sdk

      - name: Install and build soostori-sdk
        run: |
          cd soostori-sdk
          npm install -g pnpm@9
          pnpm install --no-frozen-lockfile
          pnpm run build
        env:
          NPM_CONFIG_REGISTRY: https://registry.nextmavens.com/

      - name: Patch tsconfig paths to use built .d.ts files (not .ts sources)
        run: |
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('tsconfig.ci.json', 'utf8'));
          for (const [k, v] of Object.entries(cfg.compilerOptions.paths)) {
            if (Array.isArray(v) && v[0].includes('/src/index.ts')) {
              cfg.compilerOptions.paths[k] = v.map(p => p.replace('/src/index.ts', '/dist/index.d.ts'));
            }
          }
          fs.writeFileSync('tsconfig.ci.json', JSON.stringify(cfg, null, 2));
          console.log('Patched to use dist/');
          "

      - name: TypeScript check
        run: pnpm exec tsc --noEmit -p tsconfig.ci.json

  build:
    name: Build Electron App
    runs-on: windows-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Checkout soostori-sdk (for tsconfig paths)
        uses: actions/checkout@v4
        with:
          repository: Mkid095/soostori-sdk
          ref: main
          path: soostori-sdk

      - name: Write Verdaccio .npmrc
        run: |
          echo "@soostori:registry=https://registry.nextmavens.com/" > .npmrc
          echo "//registry.nextmavens.com/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc

      - name: Install and build soostori-sdk
        run: |
          cd soostori-sdk
          npm install -g pnpm@9
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Patch tsconfig for build
        run: |
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('tsconfig.json', 'utf8'));
          for (const [k, v] of Object.entries(cfg.compilerOptions.paths)) {
            if (Array.isArray(v) && v[0].includes('/src/index.ts')) {
              cfg.compilerOptions.paths[k] = v.map(p => p.replace('/src/index.ts', '/dist/index.d.ts'));
            }
          }
          fs.writeFileSync('tsconfig.json', JSON.stringify(cfg, null, 2));
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm run build

      - name: Package Windows executable
        run: pnpm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soostori-pos-win32-x64
          path: |
            dist-electron/win-unpacked/**
            dist-electron/*.exe
          retention-days: 14

  # Placeholder for E2E tests — run when playwright tests are added
