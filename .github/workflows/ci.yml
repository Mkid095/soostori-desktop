name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: '20'

jobs:
  # Type check is advisory — Desktop uses local SDK source (paths in tsconfig.json)
  # that CI cannot reproduce. The full type-check must be run locally before pushing.
  # CI verifies: pnpm install succeeds with Verdaccio auth + build + package.
  type-check:
    name: Type Check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Write Verdaccio .npmrc
        run: |
          echo "@soostori:registry=https://registry.nextmavens.com/" > .npmrc
          echo "//registry.nextmavens.com/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit || true

  build:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: type-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Write Verdaccio .npmrc
        run: |
          echo "@soostori:registry=https://registry.nextmavens.com/" > .npmrc
          echo "//registry.nextmavens.com/:_authToken=${{ secrets.VERDACCIO_AUTH_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Electron app
        run: pnpm run build

      - name: Package Windows executable
        run: pnpm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soostori-pos-win32-x64
          path: |
            dist-electron/win-unpacked/**
            dist-electron/*.exe
          retention-days: 14
